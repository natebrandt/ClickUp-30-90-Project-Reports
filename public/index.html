<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClickUp Time Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0f14; color: #e2e8f0; min-height: 100vh; }
    header { background: #161b27; border-bottom: 1px solid #2a3348; padding: 16px 28px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
    header span { font-size: 13px; color: #64748b; }
    .layout { display: flex; min-height: calc(100vh - 57px); }
    .sidebar { width: 300px; flex-shrink: 0; background: #161b27; border-right: 1px solid #2a3348; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .sidebar h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #64748b; margin-bottom: 4px; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
    input, textarea { width: 100%; background: #0d0f14; border: 1px solid #2a3348; border-radius: 6px; color: #e2e8f0; font-size: 13px; padding: 8px 10px; outline: none; transition: border-color .15s; }
    input:focus, textarea:focus { border-color: #7c6af7; }
    textarea { resize: vertical; min-height: 72px; font-family: monospace; }
    .row-group { display: flex; flex-direction: column; gap: 6px; }
    .btn { cursor: pointer; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; padding: 9px 14px; transition: opacity .15s, background .15s; }
    .btn:hover { opacity: .87; } .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary   { background: #7c6af7; color: #fff; width: 100%; }
    .btn-secondary { background: #1e2a3a; color: #94a3b8; border: 1px solid #2a3348; font-size: 12px; padding: 6px 10px; }
    .btn-ghost     { background: transparent; color: #475569; border: 1px solid #2a3348; font-size: 12px; padding: 6px 10px; width: 100%; }
    .btn-ghost:hover { color: #94a3b8; border-color: #3d4f6b; }
    .detect-row { display: flex; gap: 6px; align-items: flex-end; }
    .detect-row input { flex: 1; }
    #status { font-size: 12px; color: #64748b; min-height: 18px; }
    #status.error { color: #f87171; } #status.success { color: #4ade80; }
    .main { flex: 1; padding: 24px 28px; overflow-x: auto; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { border-bottom: 2px solid #2a3348; }
    thead th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #64748b; white-space: nowrap; }
    thead th.num { text-align: right; }
    tbody tr { border-bottom: 1px solid #1e2535; transition: background .1s; }
    tbody tr:hover { background: #161b27; }
    td { padding: 10px 14px; vertical-align: middle; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; }
    td.time-90 { color: #7c6af7; } td.time-30 { color: #38bdf8; } td.pm-90 { color: #4ade80; } td.dash { color: #334155; }
    .space-tag { display: inline-block; background: #1e2a3a; border: 1px solid #2a3348; border-radius: 4px; font-size: 11px; padding: 2px 7px; color: #64748b; margin-left: 6px; vertical-align: middle; }
    .totals-row { background: #161b27; border-top: 2px solid #2a3348 !important; }
    .totals-row td { font-weight: 600; color: #e2e8f0; }
    .totals-row td.time-90 { color: #a78bfa; } .totals-row td.time-30 { color: #7dd3fc; } .totals-row td.pm-90 { color: #86efac; }
    .empty { padding: 48px; text-align: center; color: #334155; font-size: 14px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #2a3348; border-top-color: #7c6af7; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta-bar { display: flex; gap: 20px; margin-bottom: 18px; font-size: 12px; color: #475569; flex-wrap: wrap; align-items: center; }
    .meta-bar strong { color: #94a3b8; }
    .cache-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .cache-hit  { background: #14532d; color: #4ade80; }
    .cache-miss { background: #1e1b4b; color: #a78bfa; }
    .sort-btn { cursor: pointer; user-select: none; } .sort-btn:hover { color: #e2e8f0; }
    #termLog { display:none; font-family:'SF Mono','Fira Code',monospace; font-size:12px; background:#0a0c10; border:1px solid #2a3348; border-radius:8px; padding:16px; height:320px; overflow-y:auto; margin-bottom:20px; }
    #termLog .line { line-height:1.7; white-space:pre-wrap; word-break:break-all; }
    #termLog .line .ts { color:#334155; margin-right:8px; user-select:none; }
    #termLog .line.ok   .msg { color:#4ade80; }
    #termLog .line.info .msg { color:#94a3b8; }
    #termLog .line.dim  .msg { color:#475569; }
    #termLog .line.warn .msg { color:#fbbf24; }
    #termLog .line.err  .msg { color:#f87171; }
    #termLog .line.head .msg { color:#7c6af7; font-weight:600; }
    .filter-bar { display:flex; gap:12px; align-items:center; margin-bottom:14px; font-size:12px; flex-wrap:wrap; }
    .filter-bar label { color:#64748b; }
    .filter-bar select { background:#161b27; border:1px solid #2a3348; border-radius:5px; color:#e2e8f0; font-size:12px; padding:5px 10px; outline:none; cursor:pointer; transition:border-color .15s; }
    .filter-bar select:focus { border-color:#7c6af7; }
    .filter-bar .clear-btn { background:none; border:none; color:#475569; cursor:pointer; font-size:12px; padding:4px 8px; border-radius:4px; }
    .filter-bar .clear-btn:hover { color:#94a3b8; background:#1e2a3a; }
    td.pct { text-align:right; font-variant-numeric:tabular-nums; font-family:'SF Mono','Fira Code',monospace; font-size:13px; color:#f59e0b; }
    .space-picker-list { display: flex; flex-direction: column; gap: 4px; }
    .space-picker-item { display: flex; align-items: center; gap: 8px; background: #0d0f14; border: 1px solid #2a3348; border-radius: 5px; padding: 7px 10px; cursor: pointer; font-size: 12px; transition: border-color .1s; }
    .space-picker-item:hover { border-color: #7c6af7; }
    .space-picker-item input[type=checkbox] { accent-color: #7c6af7; cursor: pointer; }
    .space-picker-item .sp-name { flex: 1; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .space-picker-item .sp-id { font-family: monospace; color: #475569; font-size: 11px; }
    .space-picker-apply { margin-top: 6px; }
  </style>
</head>
<body>
<header>
  <h1>ClickUp Time Report</h1>
  <span>90-day &amp; 30-day totals by list</span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div><h2>Configuration</h2></div>
    <div class="row-group">
      <label for="teamId">Workspace (Team) ID</label>
      <div class="detect-row">
        <input type="text" id="teamId" placeholder="e.g. 1230709" />
        <button class="btn btn-secondary" id="detectBtn">Detect</button>
      </div>
    </div>
    <div class="row-group">
      <label for="spaceIds">Space IDs <span style="color:#475569">(one per line)</span></label>
      <textarea id="spaceIds" placeholder="90123456&#10;90123457"></textarea>
      <button class="btn btn-secondary" id="browseBtn" style="margin-top:2px">Browse Spaces…</button>
    </div>
    <div id="spacePicker" style="display:none"></div>
    <div class="row-group">
      <label for="pmGroupName">PM Group Name</label>
      <input type="text" id="pmGroupName" value="2025_PM" placeholder="2025_PM" />
    </div>
    <button class="btn btn-primary" id="runBtn">Run Report</button>
    <button class="btn btn-ghost" id="forceBtn" style="display:none">↺ Force Refresh Cache</button>
    <div id="status"></div>
    <div style="font-size:11px; color:#334155; line-height:1.6; margin-top:auto">
      First load fetches live data and caches it for 2 hours. The ClickUp API token is stored in Vercel — it never reaches the browser.
    </div>
  </aside>
  <main class="main">
    <div id="metaBar" class="meta-bar" style="display:none"></div>
    <div id="filterBar" style="display:none" class="filter-bar"></div>
    <div id="termLog"></div>
    <div class="table-wrap">
      <div id="tableContainer">
        <div class="empty">Configure settings and click <strong>Run Report</strong> to load data.</div>
      </div>
    </div>
  </main>
</div>
<script>
  const $ = id => document.getElementById(id);
  ['teamId','spaceIds','pmGroupName'].forEach(k => {
    const el=$(k), saved=localStorage.getItem('cu_'+k);
    if (saved) el.value=saved;
    el.addEventListener('input',()=>localStorage.setItem('cu_'+k,el.value));
  });

  function msToHHMM(ms) {
    if (!ms||ms<=0) return null;
    const m=Math.floor(Math.abs(ms)/60000);
    return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  }
  function setStatus(msg,type='') { const el=$('status'); el.className=type; el.innerHTML=msg; }
  function escHtml(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const _logEl = () => $('termLog');
  function logClear() { const el=_logEl(); el.innerHTML=''; el.style.display='block'; }
  function log(msg, level='info') {
    const el=_logEl();
    const ts=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const line=document.createElement('div');
    line.className=`line ${level}`;
    line.innerHTML=`<span class="ts">[${ts}]</span><span class="msg">${escHtml(msg)}</span>`;
    el.appendChild(line);
    el.scrollTop=el.scrollHeight;
  }

  // All ClickUp API calls go through the server-side proxy (token never in browser).
  async function cuFetch(path) {
    const res=await fetch(`/api/clickup?path=${encodeURIComponent(path)}`);
    if (!res.ok) { const b=await res.json().catch(()=>({})); throw new Error(`API error ${res.status}: ${b.err||b.error||res.statusText}`); }
    return res.json();
  }

  $('detectBtn').addEventListener('click', async () => {
    $('detectBtn').disabled=true; setStatus('<span class="spinner"></span>Detecting…');
    try {
      const data=await cuFetch('/team'), teams=data.teams||[];
      if (!teams.length) throw new Error('No workspaces found.');
      if (teams.length===1) { $('teamId').value=teams[0].id; localStorage.setItem('cu_teamId',teams[0].id); setStatus(`✓ Found: <strong>${escHtml(teams[0].name)}</strong>`,'success'); }
      else setStatus('Multiple workspaces — enter ID manually: '+teams.map(t=>`${t.name} (${t.id})`).join(', '));
    } catch(e) { setStatus(e.message,'error'); } finally { $('detectBtn').disabled=false; }
  });

  $('browseBtn').addEventListener('click', async () => {
    const teamId=$('teamId').value.trim();
    if (!teamId) { setStatus('Enter your Workspace ID first.','error'); return; }
    $('browseBtn').disabled=true; setStatus('<span class="spinner"></span>Loading spaces…');
    try {
      const data=await cuFetch(`/team/${teamId}/space?archived=false`), spaces=data.spaces||[];
      if (!spaces.length) throw new Error('No spaces found.');
      const cur=new Set($('spaceIds').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean));
      let html='<div class="space-picker-list">';
      spaces.forEach(s=>{html+=`<label class="space-picker-item"><input type="checkbox" value="${s.id}" ${cur.has(String(s.id))?'checked':''}/><span class="sp-name">${escHtml(s.name)}</span><span class="sp-id">${s.id}</span></label>`;});
      html+='</div><button class="btn btn-secondary space-picker-apply" id="applySpaces">Apply selection</button>';
      const picker=$('spacePicker'); picker.innerHTML=html; picker.style.display='block'; setStatus('');
      $('applySpaces').addEventListener('click',()=>{
        const ids=[...picker.querySelectorAll('input:checked')].map(cb=>cb.value);
        $('spaceIds').value=ids.join('\n'); localStorage.setItem('cu_spaceIds',$('spaceIds').value);
        picker.style.display='none'; setStatus(`✓ ${ids.length} space(s) selected`,'success');
      });
    } catch(e) { setStatus(e.message,'error'); } finally { $('browseBtn').disabled=false; }
  });

  async function fetchReport(force=false) {
    const teamId=$('teamId').value.trim(), spaceRaw=$('spaceIds').value.trim(), pmGroup=$('pmGroupName').value.trim();
    if (!teamId)   { setStatus('Workspace ID is required.','error'); return; }
    if (!spaceRaw) { setStatus('At least one Space ID is required.','error'); return; }
    const spaceIds=spaceRaw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    $('runBtn').disabled=$('forceBtn').disabled=true;
    $('metaBar').style.display='none';
    $('tableContainer').innerHTML='';
    logClear();
    log('Starting report…','head');

    const cacheParams=new URLSearchParams({teamId, spaceIds:spaceIds.join(','), pmGroup});

    // Check server-side cache first (unless force refresh)
    if (!force) {
      try {
        setStatus('<span class="spinner"></span>Checking cache…');
        log('Checking server cache…');
        const cr=await fetch(`/api/report?${cacheParams}`);
        const cd=await cr.json();
        if (cd.cached !== false) {
          log('Cache hit — rendering result','ok');
          renderTable(cd, cr.headers.get('X-Cache')==='HIT');
          $('forceBtn').style.display='block';
          setStatus('✓ Loaded from cache','success');
          $('runBtn').disabled=$('forceBtn').disabled=false;
          _logEl().style.display='none';
          return;
        }
        log('Cache miss — fetching live data','warn');
      } catch(_) { log('Cache unavailable — fetching live data','warn'); }
    } else {
      log('Force refresh — skipping cache','warn');
    }

    // Cache miss — do full live fetch client-side
    try {
      const now=Date.now(), start90=now-90*24*60*60*1000, start30=now-30*24*60*60*1000;
      log('Fetching workspace members, lists, and PM group in parallel…');
      setStatus('<span class="spinner"></span>Loading members, lists, and PM group…');
      const [listMap,{ids:allMemberIds,nameById},pmUserIds]=await Promise.all([
        fetchAllLists(spaceIds), fetchAllMemberIds(teamId), fetchPMUserIds(teamId,pmGroup)
      ]);
      const listCount=Object.keys(listMap).length;
      if (!listCount) throw new Error('No lists found in the configured spaces.');
      log(`✓ ${listCount} lists found across ${spaceIds.length} space(s)`,'ok');
      log(`✓ ${allMemberIds.length} workspace members  |  ${pmUserIds.length} PM members`,'ok');
      log(`Fetching time entries for ${allMemberIds.length} members (90-day window)…`);
      log(`  Sending: start=${new Date(start90).toLocaleDateString()} end=${new Date(now).toLocaleDateString()} (${start90} – ${now})`,'dim');
      setStatus(`<span class="spinner"></span>Fetching time entries…`);

      const entries90=await fetchTimeEntries(teamId,allMemberIds,start90,now);
      // Client-side safety filter — guards against the API returning all-time data
      const filtered90=entries90.filter(e=>{ const s=Number(e.start); return s>=start90&&s<=now; });
      if (filtered90.length!==entries90.length) log(`  ⚠ Date filter applied client-side: ${entries90.length.toLocaleString()} → ${filtered90.length.toLocaleString()} entries`,'warn');
      const entries30=filtered90.filter(e=>Number(e.start)>=start30);
      log(`✓ ${filtered90.length.toLocaleString()} entries in 90-day window  |  ${entries30.length.toLocaleString()} in last 30 days`,'ok');
      log('Aggregating by list…');
      const lists=aggregateByList(filtered90,entries30,listMap,pmUserIds,nameById);
      log(`✓ Aggregation complete — ${lists.length} lists`,'ok');

      const report={
        generatedAt:new Date().toISOString(),
        cached:true,
        windows:{start90,start30,end:now},
        meta:{totalEntries:filtered90.length, memberCount:allMemberIds.length, pmMemberCount:pmUserIds.length},
        lists
      };

      log('Rendering table…','dim');
      renderTable(report, false);
      $('forceBtn').style.display='block';
      log('Saving result to server cache…','dim');

      // Write result to server cache asynchronously
      fetch(`/api/report?${cacheParams}`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(report)
      }).then(()=>log('✓ Cached — next load will be instant','ok')).catch(()=>log('Cache write failed (non-critical)','warn'));

      setStatus('✓ Report loaded','success');
      setTimeout(()=>{ _logEl().style.display='none'; }, 3000);
    } catch(e) {
      log(`Error: ${e.message}`,'err');
      $('tableContainer').innerHTML=`<div class="empty" style="color:#f87171">${escHtml(e.message)}</div>`;
      setStatus(e.message,'error');
    } finally { $('runBtn').disabled=$('forceBtn').disabled=false; }
  }

  $('runBtn').addEventListener('click',()=>fetchReport(false));
  $('forceBtn').addEventListener('click',()=>fetchReport(true));

  async function fetchPMUserIds(teamId,groupName) {
    if (!groupName) return [];
    const data=await cuFetch(`/group?team_id=${teamId}`);
    const match=(data.groups||[]).find(g=>g.name===groupName||(g.alias&&g.alias.replace(/^@/,'')===groupName.replace(/^@/,'')));
    if (!match) return [];
    return (match.members||[]).map(m=>String(m.user?.id??m.id));
  }

  async function fetchAllMemberIds(teamId) {
    const data=await cuFetch('/team');
    const team=(data.teams||[]).find(t=>String(t.id)===String(teamId));
    if (!team) throw new Error(`Workspace ${teamId} not found.`);
    const nameById={};
    const ids=(team.members||[]).map(m=>{
      const id=String(m.user?.id??m.id);
      nameById[id]=m.user?.username||m.user?.email||id;
      return id;
    }).filter(Boolean);
    return {ids,nameById};
  }

  async function fetchAllLists(spaceIds) {
    const map={};
    await Promise.all(spaceIds.map(async spaceId=>{
      let spaceName=spaceId;
      try { spaceName=(await cuFetch(`/space/${spaceId}`)).name||spaceId; } catch(_){}
      const fl=await cuFetch(`/space/${spaceId}/list?archived=false`);
      (fl.lists||[]).forEach(l=>{map[String(l.id)]={name:l.name,spaceName};});
      const fd=await cuFetch(`/space/${spaceId}/folder?archived=false`);
      await Promise.all((fd.folders||[]).map(async folder=>{
        const fl2=await cuFetch(`/folder/${folder.id}/list?archived=false`);
        (fl2.lists||[]).forEach(l=>{map[String(l.id)]={name:l.name,spaceName};});
      }));
    }));
    return map;
  }

  async function fetchTimeEntries(teamId,memberIds,startMs,endMs) {
    const seen=new Set();
    const all=[];
    let page=0;
    while(true) {
      const params=new URLSearchParams({start_date:String(Math.floor(startMs)),end_date:String(Math.floor(endMs)),include_location_names:'true',assignee:memberIds.join(','),page:String(page)});
      const data=await cuFetch(`/team/${teamId}/time_entries?${params}`);
      const entries=data.data||[];
      // Count genuinely new entries on this page to detect when pagination stops yielding new data
      let newCount=0;
      for (const e of entries) {
        if (e.id&&!seen.has(e.id)) { seen.add(e.id); all.push(e); newCount++; }
      }
      log(`  Page ${page+1}: ${entries.length} returned, ${newCount} new (${all.length.toLocaleString()} total unique)`,'dim');
      // Stop if no new entries or the page was partial (end of data)
      if (newCount===0||entries.length<50) break;
      page++; if (page>200) break;
    }
    return all;
  }

  function aggregateByList(entries90,entries30,listMap,pmUserIds,nameById={}) {
    const pmSet=new Set(pmUserIds);
    const map=Object.fromEntries(Object.entries(listMap).map(([id,v])=>[id,{name:v.name,spaceName:v.spaceName,ms90:0,ms30:0,pmMs90:0,pmBreakdown:{}}]));
    entries90.forEach(e=>{
      const listId=String(e.task_location?.list_id);
      if (!listId||listId==='null'||!map[listId]) return;
      const dur=Number(e.duration);
      if (dur<=0) return; // skip running timers (negative duration) and zero-duration entries
      map[listId].ms90+=dur;
      const uid=String(e.user?.id);
      if (pmSet.has(uid)){
        map[listId].pmMs90+=dur;
        map[listId].pmBreakdown[uid]=(map[listId].pmBreakdown[uid]||0)+dur;
      }
    });
    entries30.forEach(e=>{
      const listId=String(e.task_location?.list_id);
      if (!listId||listId==='null'||!map[listId]) return;
      const dur=Number(e.duration);
      if (dur<=0) return;
      map[listId].ms30+=dur;
    });
    return Object.entries(map).map(([id,v])=>({id,...v,
      pmPct: v.ms90>0 ? v.pmMs90/v.ms90 : 0,
      pmContributors:Object.entries(v.pmBreakdown)
        .sort((a,b)=>b[1]-a[1])
        .map(([uid,ms])=>({name:nameById[uid]||uid,ms}))
    })).sort((a,b)=>a.name.localeCompare(b.name));
  }

  let _rows=[], _sortCol='name', _sortDir=1, _pmFilter='';
  function renderTable(data, cacheHit) {
    _rows=data.lists||[]; _sortCol='name'; _sortDir=1; _pmFilter='';
    const {windows,meta}=data, fmt=ms=>new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const badge=cacheHit?'<span class="cache-badge cache-hit">Cached</span>':'<span class="cache-badge cache-miss">Live</span>';
    $('metaBar').style.display='flex';
    $('metaBar').innerHTML=`
      <span><strong>90-day:</strong> ${fmt(windows.start90)} – ${fmt(windows.end)}</span>
      <span><strong>30-day:</strong> ${fmt(windows.start30)} – ${fmt(windows.end)}</span>
      <span><strong>Entries:</strong> ${meta.totalEntries.toLocaleString()}</span>
      <span><strong>Members:</strong> ${meta.memberCount} | <strong>PM:</strong> ${meta.pmMemberCount}</span>
      <span><strong>Generated:</strong> ${new Date(data.generatedAt).toLocaleString()}</span>
      ${badge}`;
    // Build PM filter dropdown from all unique contributor names
    const allPMs=[...new Set(_rows.flatMap(r=>(r.pmContributors||[]).map(p=>p.name)))].sort();
    const fb=$('filterBar');
    fb.style.display='flex';
    fb.innerHTML=`<label>Filter by PM:</label>
      <select id="pmFilterSelect"><option value="">All PMs</option>${allPMs.map(n=>`<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('')}</select>
      <button class="clear-btn" id="clearPmFilter" style="display:none">× Clear</button>`;
    $('pmFilterSelect').addEventListener('change',e=>{
      _pmFilter=e.target.value;
      $('clearPmFilter').style.display=_pmFilter?'inline':'none';
      drawTable();
    });
    $('clearPmFilter').addEventListener('click',()=>{
      _pmFilter=''; $('pmFilterSelect').value=''; $('clearPmFilter').style.display='none'; drawTable();
    });
    drawTable();
  }
  function drawTable() {
    const base=_pmFilter ? _rows.filter(r=>(r.pmContributors||[]).some(p=>p.name===_pmFilter)) : _rows;
    const sorted=[...base].sort((a,b)=>{const av=a[_sortCol],bv=b[_sortCol];return typeof av==='string'?_sortDir*av.localeCompare(bv):_sortDir*(av-bv);});
    const totals=sorted.reduce((acc,r)=>{acc.ms90+=r.ms90;acc.ms30+=r.ms30;acc.pmMs90+=r.pmMs90;return acc;},{ms90:0,ms30:0,pmMs90:0});
    const totalPct=totals.ms90>0?(totals.pmMs90/totals.ms90*100).toFixed(1)+'%':'—';
    const sh=(col,label)=>{const arrow=_sortCol===col?(_sortDir===1?' ↑':' ↓'):'';return `<th class="num sort-btn" data-col="${col}">${label}${arrow}</th>`;};
    let html=`<table><thead><tr><th class="sort-btn" data-col="name">List Name</th><th class="sort-btn" data-col="spaceName">Space</th>${sh('ms90','Time // 90 Days')}${sh('ms30','Time // 30 Days')}${sh('pmMs90','PM Time // 90 Days')}${sh('pmPct','PM %')}<th>PM Contributors</th></tr></thead><tbody>`;
    const tid=$('teamId').value.trim();
    sorted.forEach(r=>{
      const t90=msToHHMM(r.ms90),t30=msToHHMM(r.ms30),pm90=msToHHMM(r.pmMs90);
      const pct=r.ms90>0?(r.pmMs90/r.ms90*100).toFixed(1)+'%':'—';
      const cuUrl=`https://app.clickup.com/${tid}/v/l/${r.id}`;
      const contrib=(r.pmContributors||[]).map(p=>`${escHtml(p.name)} (${msToHHMM(p.ms)||'—'})`).join('<br>')||'—';
      html+=`<tr><td><a href="${cuUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid #2a3348;" onmouseover="this.style.borderBottomColor='#7c6af7'" onmouseout="this.style.borderBottomColor='#2a3348'">${escHtml(r.name)}</a></td><td><span class="space-tag">${escHtml(r.spaceName)}</span></td><td class="num ${t90?'time-90':'dash'}">${t90||'—'}</td><td class="num ${t30?'time-30':'dash'}">${t30||'—'}</td><td class="num ${pm90?'pm-90':'dash'}">${pm90||'—'}</td><td class="pct">${pct}</td><td style="font-size:11px;color:#64748b;line-height:1.8">${contrib}</td></tr>`;
    });
    html+=`<tr class="totals-row"><td colspan="2">Total (${sorted.length} lists)</td><td class="num time-90">${msToHHMM(totals.ms90)||'—'}</td><td class="num time-30">${msToHHMM(totals.ms30)||'—'}</td><td class="num pm-90">${msToHHMM(totals.pmMs90)||'—'}</td><td class="pct" style="color:#fbbf24">${totalPct}</td><td></td></tr></tbody></table>`;
    $('tableContainer').innerHTML=html;
    $('tableContainer').querySelectorAll('[data-col]').forEach(el=>{
      el.style.cursor='pointer';
      el.addEventListener('click',()=>{const col=el.dataset.col;if(_sortCol===col)_sortDir*=-1;else{_sortCol=col;_sortDir=(col==='name'||col==='spaceName')?1:-1;}drawTable();});
    });
  }
</script>
</body>
</html>
